[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "precedent-engine"
version = "0.1.0"
description = "Past outcomes of similar events, from news, markets and filings. Not a forecast."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2",
    "pyarrow>=15",
    "httpx>=0.27",
    "mcp>=2,<3",
    "Pillow>=10",
]

[project.optional-dependencies]
research = ["pyqlib==0.9.7", "lightgbm", "scipy", "pyyaml", "networkx"]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
precedent = "precedent.cli:main"
precedent-mcp = "precedent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/precedent"]

[tool.hatch.build.targets.wheel.force-include]
"references" = "precedent/references"

[tool.ruff]
line-length = 100
extend-exclude = ["docs/superpowers/specs/2026-11-06-predate-design-listings"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long literal assertions are allowed in tests.
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
